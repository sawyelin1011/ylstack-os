name: Build YL StackOS Rootfs

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Ubuntu 22.04.5 LTS aarch64 base
        run: |
          wget -O ubuntu-base.tar.gz https://cdimage.ubuntu.com/ubuntu-base/releases/22.04.5/release/ubuntu-base-22.04.5-base-arm64.tar.gz
          echo "075d4abd2817a5023ab0a82f5cb314c5ec0aa64a9c0b40fd3154ca3bfdae979f  ubuntu-base.tar.gz" | sha256sum -c

      - name: Extract Ubuntu base
        run: |
          mkdir ubuntu-rootfs
          tar -xzf ubuntu-base.tar.gz -C ubuntu-rootfs --numeric-owner

      - name: Install QEMU for ARM64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64

      - name: Copy QEMU to rootfs
        run: |
          sudo cp /usr/bin/qemu-aarch64-static ubuntu-rootfs/usr/bin/

      - name: Setup DNS in rootfs
        run: |
          echo 'nameserver 1.1.1.1' | sudo tee ubuntu-rootfs/etc/resolv.conf
          echo 'nameserver 8.8.8.8' | sudo tee -a ubuntu-rootfs/etc/resolv.conf

      - name: Install preinstalled services
        run: |
          cat > /tmp/install_services.sh << 'SCRIPT'
#!/bin/bash
set -e
export DEBIAN_FRONTEND=noninteractive
apt-get update
apt-get install -y \
  openssh-server \
  ttyd \
  python3 \
  python3-pip \
  python3-venv \
  python3-flask \
  python3-flask-login \
  python3-psutil \
  python3-requests \
  python3-rich \
  sqlite3 \
  net-tools \
  iproute2 \
  curl \
  wget \
  git \
  vim \
  nano \
  htop \
  lsof \
  netcat-openbsd \
  busybox
apt-get clean
rm -rf /var/lib/apt/lists/*
rm -rf /root/.cache/pip
# Android network group permissions
groupadd -g 3003 aid_inet 2>/dev/null || true
groupadd -g 3004 aid_net_raw 2>/dev/null || true
groupadd -g 1003 aid_graphics 2>/dev/null || true
usermod -g 3003 -G 3003,3004 -a _apt 2>/dev/null || true
usermod -G 3003 -a root 2>/dev/null || true
# SSH setup
mkdir -p /run/sshd
echo 'root:ylstackos' | chpasswd
sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
sed -i 's/#Port 22/Port 2222/' /etc/ssh/sshd_config
SCRIPT
          sudo cp /tmp/install_services.sh ubuntu-rootfs/install_services.sh
          sudo chmod +x ubuntu-rootfs/install_services.sh
          sudo chroot ubuntu-rootfs /bin/bash /install_services.sh
          sudo rm ubuntu-rootfs/install_services.sh

      - name: Apply OS identity fixes
        run: |
          echo "ylstackos" | sudo tee ubuntu-rootfs/etc/hostname
          echo "YL StackOS — Andronix Edition" | sudo tee ubuntu-rootfs/etc/motd
          printf 'YL StackOS — Andronix Edition \\n \\l\nRunning on Android (rooted) · Ubuntu 22.04.5 LTS aarch64\n' | sudo tee ubuntu-rootfs/etc/issue
          echo "ylstackos" | sudo tee ubuntu-rootfs/etc/debian_chroot
          printf 'LANG=C.UTF-8\nLC_ALL=C.UTF-8\n' | sudo tee ubuntu-rootfs/etc/default/locale
          sudo sed -i 's|python3 /flyos/motd/motd.py|python3 /ylstackos/motd/motd.py|g' ubuntu-rootfs/etc/bash.bashrc
          sudo rm -f ubuntu-rootfs/etc/update-motd.d/91-contract-ua-esm-status
          printf '127.0.0.1 localhost\n127.0.1.1 ylstackos ylstackos.local\n' | sudo tee ubuntu-rootfs/etc/hosts

      - name: Add Node.js hijack.js
        run: |
          printf '// Node.js networkInterfaces stub for Android\nconst os = require("os");\nos.networkInterfaces = () => ({ lo: [{ address: "127.0.0.1", netmask: "255.0.0.0", family: "IPv4" }] });\n' | sudo tee ubuntu-rootfs/root/hijack.js

      - name: Copy dashboard
        run: |
          sudo cp -r dashboard ubuntu-rootfs/ylstackos

      - name: Update VERSION file
        run: |
          printf '{\n  "version": "4.0.0",\n  "name": "YL StackOS — Andronix Edition",\n  "build_date": "%s",\n  "paths": {\n    "root": "/ylstackos/",\n    "logs": "/ylstackos/logs/",\n    "static": "/ylstackos/static/dist/"\n  }\n}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | sudo tee ubuntu-rootfs/ylstackos/VERSION

      - name: Update sysconf.py
        run: |
          sudo sed -i 's/os_ver = "3.2"/os_ver = "4.0"/g' ubuntu-rootfs/ylstackos/sysconf.py
          sudo sed -i 's/os_build_channel = "3200"/os_build_channel = "4000"/g' ubuntu-rootfs/ylstackos/sysconf.py

      - name: Package rootfs
        run: |
          sudo tar --exclude=proc --exclude=sys --exclude=dev --exclude=run --exclude=tmp -czf ylstackos-rootfs-4.0-aarch64.tar.gz ubuntu-rootfs/

      - name: Generate SHA256
        run: |
          sha256sum ylstackos-rootfs-4.0-aarch64.tar.gz > ylstackos-rootfs-4.0-aarch64.tar.gz.sha256
          cat ylstackos-rootfs-4.0-aarch64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            ylstackos-rootfs-4.0-aarch64.tar.gz
            ylstackos-rootfs-4.0-aarch64.tar.gz.sha256

      - name: Release
        uses: softprops/action-gh-release@v1gh
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ylstackos-rootfs-4.0-aarch64.tar.gz
            ylstackos-rootfs-4.0-aarch64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
